name: Apply Safe Lock Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate-lock:
    if: github.head_ref == 'audit/coh-hardening-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply semver-safe audit remediation to lockfile only
        run: npm audit fix --package-lock-only || true

      - name: Commit remediated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock remediation required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply safe dependency lockfile remediation"
          git push origin HEAD:${{ github.head_ref }}
